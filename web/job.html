<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>See Subtitles — Job</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/app.css">
</head>
<body class="control app">
<div class="topbar"><a class="brand" href="/"><svg viewBox="0 0 824 824" aria-hidden="true"><rect width="824" height="824" rx="185" fill="#131210"/><circle cx="196" cy="196" r="46" fill="#ff453a"/><rect x="150" y="452" width="524" height="96" rx="48" fill="#f1ece2"/><rect x="232" y="596" width="360" height="72" rx="36" fill="#f5c518"/></svg><h1>See Subtitles</h1></a><a href="/">← Files</a><span class="muted" id="title">Job</span><span class="spacer"></span><span class="muted" id="who"></span></div>
<main>
<div class="alert" id="alert" hidden></div>
<div class="ui" id="progressBox">
  <div id="statusText"></div>
  <div class="bar" style="margin-top:6px"><i id="bar"></i></div>
</div>
<div class="jobwrap" id="work" hidden>
  <div>
    <div class="ui">
      <video id="video" controls playsinline></video>
      <div class="subs" id="subs"></div>
    </div>
    <div class="ui">
      <h2>Downloads</h2>
      <div class="files" id="files"></div>
      <h2 style="margin-top:14px">Burn subtitles into the video</h2>
      <div class="btns">
        <select id="mp4which"><option value="trans">translation</option><option value="both">translation + original</option><option value="text">original</option></select>
        <button id="btnMp4">Render MP4</button>
        <span class="muted" id="mp4Text"></span>
      </div>
    </div>
  </div>
  <div class="ui">
    <div class="sticky btns">
      <h2 style="display:inline;margin-right:10px">Cues</h2>
      <button class="primary" id="btnSave" disabled>Save changes</button>
      <button id="btnShift">Shift all…</button>
      <span class="muted" id="saveText"></span>
    </div>
    <div class="cues" id="cues"></div>
  </div>
</div>
</main>
<script src="/job.js"></script>
</body>
</html>
