appId: com.alexlaff.subtitles
productName: Subtitles
copyright: MIT
directories:
  output: dist
  buildResources: build
files:
  - main.js
  - preload.js
  - local-server.js
  - cloud.js
  - settings.html
  - lib/**
  - package.json
extraResources:
  - from: ../web
    to: web
  - from: resources/bin
    to: bin
asar: true
npmRebuild: false
# Updates are served by the hosted server (server/lib/updates.js): copy dist/latest-mac.yml, the zip and the dmg
# into its <DATA_DIR>/updates. The app checks <server>/updates on launch and from Subtitles → Check for Updates…
publish:
  provider: generic
  url: https://seesubtitles.com/updates
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Subtitles listens to the microphone to transcribe and translate speech in real time.
    LSMinimumSystemVersion: "13.0"
dmg:
  sign: false
