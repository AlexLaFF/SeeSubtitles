<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recording playback</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
</head>
<body class="control playback">
<div class="pb">
  <div class="ui pb-side">
    <h3>Recording</h3>
    <select id="recSel"></select>
    <audio id="audio" controls preload="metadata"></audio>
    <div class="row wide"><label>Subtitle size</label><input type="range" id="scale" min="14" max="120" value="34"></div>
    <div class="row wide"><label>Show Cantonese</label><input type="checkbox" id="showSrc"></div>
    <div class="muted" id="info">no recordings yet</div>
    <div class="btns"><button id="btnControl">Control page ↗</button></div>
    <h3>Cues (click to jump)</h3>
    <div class="preview cuelist" id="cues"></div>
  </div>
  <div class="pb-main">
    <div id="stage"><div id="lines"></div></div>
  </div>
</div>
<script src="/schema.js"></script>
<script src="/shared.js"></script>
<script src="/plain-text.js"></script>
<script src="/clean-downloads.js"></script>
<script src="/playback.js"></script>
</body>
</html>
