# Hosted server + Caddy (automatic HTTPS). Run from the repo root:
#   cp deploy/.env.example deploy/.env   # fill in DOMAIN + TENCENT_* keys
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      BASE_URL: https://${DOMAIN}
      TENCENT_APPID: ${TENCENT_APPID}
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY}
      TOKENHUB_API_KEY: ${TOKENHUB_API_KEY:-}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-hy-mt2-pro}
      MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-8}
      SIGNUP_MODE: ${SIGNUP_MODE:-closed}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      REQUEST_WEBHOOK_URL: ${REQUEST_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      TENCENT_PACK: ${TENCENT_PACK:-}
      TENCENT_PACK_COVERS: ${TENCENT_PACK_COVERS:-live}
      TENCENT_BILLING_SECRET_ID: ${TENCENT_BILLING_SECRET_ID:-}
      TENCENT_BILLING_SECRET_KEY: ${TENCENT_BILLING_SECRET_KEY:-}
    volumes:
      - subs-data:/data
    expose: ["8080"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
volumes:
  subs-data:
  caddy-data:
  caddy-config:
