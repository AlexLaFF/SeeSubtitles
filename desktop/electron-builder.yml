# Algernon Labs's since 0.8.4; com.alexlaff.subtitles up to 0.8.3. Squirrel.Mac checks an update against the running
# app's designated requirement, which names the identifier, so a 0.8.3 cannot update itself into this: the one
# installed copy (Alex's) was moved over by hand from the DMG. macOS keys its permissions to the identifier too —
# the microphone is asked for again on first launch. The login and settings survive: they live under the product name.
appId: com.algernonlabs.subtitles
protocols:
  - name: See Subtitles Login
    schemes: [seesubtitles]
productName: See Subtitles
copyright: MIT
directories:
  output: dist
  buildResources: build
files:
  - main.js
  - preload.js
  - local-server.js
  - cloud.js
  - lib/**
  - assets/**
  - package.json
# The app's pages only. web/ also holds the hosted site, its login, account and job pages: those are the server's
# (server/server.js) and have no business inside a signed desktop bundle. desktop/test/packaging.test.js checks that
# everything the app's pages load survives this filter.
extraResources:
  - from: ../web
    to: web
    filter:
      - "**/*"
      - "!.DS_Store"
      - "!site.*"
      - "!app.*"
      - "!account.*"
      - "!job.*"
      - "!login.html"
      - "!reset.html"
      - "!usage-tiles.js"
  - from: resources/bin
    to: bin
asar: true
# The app speaks English and Simplified Chinese. Electron ships 220 locale folders (every language, each in four
# grammatical-gender variants), and every one is signed with its own request to Apple's timestamp server: from a
# connection that drops one request in forty, builds failed three times in a day on exactly that (2026-09-21), and
# took a quarter of an hour when they did not. These eight are the two languages; English is Chromium's fallback.
electronLanguages: [en, en_FEMININE, en_MASCULINE, en_NEUTER, zh_CN, zh_CN_FEMININE, zh_CN_MASCULINE, zh_CN_NEUTER]
npmRebuild: false
# Updates are served by the hosted server (server/lib/updates.js): copy dist/latest-mac.yml, the zip and the dmg
# into its <DATA_DIR>/updates. The app checks <server>/updates on launch and from See Subtitles → Check for Updates…
publish:
  provider: generic
  url: https://seesubtitles.com/updates
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: See Subtitles listens to the microphone to transcribe and translate speech in real time.
    LSMinimumSystemVersion: "13.0"
dmg:
  sign: false
