<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>See Subtitles — Log in</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/app.css">
</head>
<body class="control app">
<div class="login">
  <div class="ui">
    <div class="brand"><svg viewBox="0 0 824 824" aria-hidden="true"><rect width="824" height="824" rx="185" fill="#131210"/><circle cx="196" cy="196" r="46" fill="#ff453a"/><rect x="150" y="452" width="524" height="96" rx="48" fill="#f1ece2"/><rect x="232" y="596" width="360" height="72" rx="36" fill="#f5c518"/></svg><span>See Subtitles</span></div>
    <h2>Log in</h2>
    <p class="muted">Live Cantonese → Mandarin subtitles, remote displays and video subtitling.</p>
    <form id="form">
      <label>Email<input id="email" type="email" autocomplete="username" required></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required minlength="8"></label>
      <label id="inviteRow" hidden>Invite code<input id="invite" autocomplete="off"></label>
      <div class="alert" id="err" hidden></div>
      <button class="primary" type="submit" id="submit">Log in</button>
      <p class="muted" id="switchRow" hidden><a href="#" id="switch">Create an account</a></p>
    </form>
  </div>
</div>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  let signup = 'closed';
  try { signup = (await fetch('/api/config').then((x) => x.json())).signup || 'closed'; } catch { /* keep login only */ }
  let creating = false;
  const render = () => {
    $('submit').textContent = creating ? 'Create account' : 'Log in';
    $('switch').textContent = creating ? 'I already have an account' : 'Create an account';
    $('inviteRow').hidden = !(creating && signup === 'invite');
    $('password').autocomplete = creating ? 'new-password' : 'current-password';
  };
  if (signup !== 'closed') { $('switchRow').hidden = false; $('switch').addEventListener('click', (e) => { e.preventDefault(); creating = !creating; render(); }); }
  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = $('err');
    err.hidden = true;
    const body = { email: $('email').value, password: $('password').value };
    if (creating) body.invite = $('invite').value;
    const r = await fetch(creating ? '/api/signup' : '/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then((x) => x.json()).catch(() => ({ error: 'network error' }));
    if (r.error) { err.textContent = r.error; err.hidden = false; return; }
    const next = new URLSearchParams(location.search).get('next');
    location.href = next && next.startsWith('/') ? next : '/';
  });
})();
</script>
</body>
</html>
